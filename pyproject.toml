[project]
name = "attendance-grades"
version = "0.3.0"
description = "Compute per-section attendance grades out of 5 from an attendance report CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["rich>=13.0"]

[project.scripts]
attendance-grades = "attendance_grades.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "attendance_grades"
module-root = "src"
